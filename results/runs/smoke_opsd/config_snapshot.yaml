__config_path__: /root/autodl-tmp/rp_lora_v0/configs/smoke_opsd.yaml
baseline_name: opsd
data:
  max_eval_examples_per_segment: 4
  max_segments: 2
  max_train_examples_per_segment: 8
  split: default
  stream_format: citb_processed
experiment_name: v1_smoke_opsd
lora:
  alpha: 32
  dropout: 0.05
  enabled: true
  r: 16
  target_modules:
  - q_proj
  - v_proj
mode: baseline
model:
  backbone_name: llama31-8b-instruct
  device: auto
  hf_model_name_or_path: assets/pretrained/Meta-Llama-3.1-8B-Instruct
  mask_all_special_tokens_in_labels: false
  mask_eos_token_in_labels: false
  torch_dtype: bfloat16
opsd:
  beta: 0.5
  divergence: jsd
  rollout_max_new_tokens: 0
  rollout_temperature: 1.0
  rollout_top_p: 1.0
output:
  run_name: smoke_opsd
  save_every_segment: true
  save_final_adapter: true
  tracking:
    use_wandb: false
  write_logs: true
  write_tables: true
paths:
  assets_dir: assets
  processed_stream_dir: data/processed
  processed_stream_file: citb_cl_dialogue_tasks_train50_eval10.json
  project_root: .
  results_dir: results
seed: 123
train:
  batch_size: 2
  epochs_per_segment: 1
  grad_clip_norm: 1.0
  log_every: 50
  lr: 0.0002
  weight_decay: 0.0
