name: cpu-tests

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install the checkout without changing the training pins
        run: |
          python -m pip install -e . --no-deps
          python -m pip install "PyYAML==6.0.3"
      - name: CPU tests
        run: |
          python -m unittest \
            tests.test_replay_budget \
            tests.test_prototype_retrieval \
            tests.test_public_wrappers \
            tests.test_benchmark_isolation \
            tests.test_corrected_factorial
