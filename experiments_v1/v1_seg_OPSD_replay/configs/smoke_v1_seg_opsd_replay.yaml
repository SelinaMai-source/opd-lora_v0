experiment_name: "v1_smoke_seg_opsd_replay"
mode: "baseline"  # debug | baseline | ours

seed: 123

baseline_name: "seg_opsd_replay"

paths:
  project_root: "."
  processed_stream_dir: "data/processed"
  processed_stream_file: "citb_cl_dialogue_tasks_train50_eval10.json"  # instrdialog, 19 段
  assets_dir: "assets"
  results_dir: "results"

data:
  stream_format: "citb_processed"
  split: "default"
  max_segments: 2
  max_train_examples_per_segment: 8
  max_eval_examples_per_segment: 4

model:
  backbone_name: "llama31-8b-instruct"
  hf_model_name_or_path: "assets/pretrained/Meta-Llama-3.1-8B-Instruct"
  torch_dtype: "bfloat16"
  device: "auto"
  mask_eos_token_in_labels: false
  mask_all_special_tokens_in_labels: false

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "v_proj"]

train:
  epochs_per_segment: 1
  batch_size: 2
  lr: 2.0e-4
  weight_decay: 0.0
  grad_clip_norm: 1.0
  log_every: 50

opsd:
  divergence: "jsd"
  beta: 0.5
  rollout_temperature: 1.0
  rollout_top_p: 1.0
  rollout_max_new_tokens: 0
  teacher_format_constraint: false

seg_opsd:
  k: 2
  teacher_adapter: "teacher"

replay:
  enabled: true
  buffer_size: 2048
  replay_ratio: 0.2
  strategy: "uniform"

# 冒烟 K=2，同 v1_seg_OPSD 冒烟；第 2 段才会抽到 replay。

output:
  run_name: ""
  save_every_segment: true
  write_tables: true
  write_logs: true
  tracking:
    use_wandb: false
