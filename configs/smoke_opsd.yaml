experiment_name: "v1_smoke_opsd"
mode: "baseline"  # debug | baseline | ours

seed: 123

baseline_name: "opsd"

paths:
  project_root: "."
  processed_stream_dir: "data/processed"
  processed_stream_file: "citb_cl_dialogue_tasks_train50_eval10.json"  # instrdialog, 19 段
  assets_dir: "assets"
  results_dir: "results"

data:
  stream_format: "citb_processed"
  split: "default"
  max_segments: 2
  max_train_examples_per_segment: 8
  max_eval_examples_per_segment: 4

model:
  backbone_name: "llama31-8b-instruct"
  hf_model_name_or_path: "assets/pretrained/Meta-Llama-3.1-8B-Instruct"
  torch_dtype: "bfloat16"
  device: "auto"
  mask_eos_token_in_labels: false
  mask_all_special_tokens_in_labels: false

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "v_proj"]

train:
  epochs_per_segment: 1
  batch_size: 2
  lr: 2.0e-4
  weight_decay: 0.0
  grad_clip_norm: 1.0
  log_every: 50

opsd:
  divergence: "jsd"        # jsd | kl
  beta: 0.5                # generalized JSD 混合系数；0.5 = 对称 JSD
  rollout_temperature: 1.0
  rollout_top_p: 1.0
  rollout_max_new_tokens: 0  # 0 = 用 model.gen_max_new_tokens（默认 64）

output:
  run_name: "smoke_opsd"   # 固定名：smoke_opsd_init_adapter 冒烟要引用其 final_adapter
  save_every_segment: true
  save_final_adapter: true
  write_tables: true
  write_logs: true
  tracking:
    use_wandb: false
