experiment_name: "v0_sequential_instrdialog"
mode: "baseline"  # debug | baseline | ours

seed: 123

baseline_name: "sequential_lora"

paths:
  project_root: "."
  processed_stream_dir: "data/processed"
  processed_stream_file: "citb_cl_dialogue_tasks_train50_eval10.json"  # instrdialog, 19 段
  assets_dir: "assets"
  results_dir: "results"

data:
  stream_format: "citb_processed"
  split: "default"
  max_segments: -1
  max_train_examples_per_segment: -1
  max_eval_examples_per_segment: -1

model:
  backbone_name: "llama31-8b-instruct"
  hf_model_name_or_path: "assets/pretrained/Meta-Llama-3.1-8B-Instruct"
  torch_dtype: "bfloat16"
  device: "auto"
  mask_eos_token_in_labels: false
  mask_all_special_tokens_in_labels: false

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "v_proj"]

train:
  epochs_per_segment: 1
  batch_size: 2
  lr: 2.0e-4
  weight_decay: 0.0
  grad_clip_norm: 1.0
  log_every: 50

replay:
  enabled: false
  buffer_size: 256
  replay_ratio: 0.3
  strategy: "uniform"

periodic:
  enabled: false
  spawn_every_segments: 2
  max_branches: 8

router:
  enabled: false
  hard_routing: true
  pseudo_label_strategy: "self_consistency"
  temperature: 1.0
  num_initial_branches: 3

output:
  run_name: "v0_sft_instrdialog"  # 固定名：v1_sft_opsd_instrdialog 的 init_adapter_path 引用该 run 的 final_adapter
  save_every_segment: true
  save_final_adapter: true  # 训练结束保存最终 adapter 到 <run_dir>/final_adapter（v1_SFT_OPSD 初始化用）
  write_tables: true
  write_logs: true
  tracking:
    use_wandb: false
